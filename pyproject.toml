[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuaiq"
version = "0.1.0"
description = "FUAIQ Arabic-first image enhancement engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.2.0", "numpy>=1.26.0"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[project.scripts]
fuaiq = "fuaiq.cli:main"

[tool.setuptools.packages.find]
include = ["fuaiq*"]

[tool.ruff]
line-length = 100
